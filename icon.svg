<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background, transparent so it can be used anywhere, but we add a rounded rect for the icon background -->
  <rect width="400" height="400" fill="#f8f9fa" rx="90" ry="90"/>
  
  <g transform="translate(200, 200)">
    <!-- Outer ring: dashed neon green -->
    <circle cx="0" cy="0" r="120" stroke="#00d26a" stroke-width="14" stroke-dasharray="24 16" fill="none"/>
    
    <!-- Inner ring: dashed neon green -->
    <circle cx="0" cy="0" r="85" stroke="#00d26a" stroke-width="10" stroke-dasharray="16 12" fill="none"/>
    
    <!-- Central white circle behind the M -->
    <circle cx="0" cy="0" r="60" fill="#ffffff"/>
    
    <!-- The M -->
    <!-- Using generic sans-serif, standard weights so it renders well everywhere -->
    <text x="0" y="28" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="80" fill="#064e3b" text-anchor="middle">M</text>
  </g>
</svg>
