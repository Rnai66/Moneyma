<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent background is ideal for a logo -->
  
  <g transform="translate(200, 140)">
    <!-- Sunburst Effect -->
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="75" stroke="#00d26a" stroke-width="10" stroke-dasharray="16 12" fill="none"/>
    
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="50" stroke="#00d26a" stroke-width="8" stroke-dasharray="10 8" fill="none"/>
    
    <!-- Central white circle -->
    <circle cx="0" cy="0" r="35" fill="#ffffff"/>
    
    <!-- The M -->
    <text x="0" y="15" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#064e3b" text-anchor="middle">M</text>
  </g>
  
  <!-- Primary Wordmark -->
  <text x="200" y="290" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="46" fill="#00d26a" text-anchor="middle">MONEYMA</text>
  
  <!-- Secondary Wordmark -->
  <text x="200" y="330" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="16" fill="#064e3b" text-anchor="middle" letter-spacing="3">PERSONAL FINANCE</text>
</svg>
