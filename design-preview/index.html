<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">

<title>MoneyMa — Design preview</title>
<link rel="stylesheet" href="app.css">
<style>

        <tbody>

          .map(([d,t,c,desc,a])=>`<tr><td><span class="inline-cell">${d}</span></td><td><span class="type-badge ${t}">${t==='income'?'↑ รายรับ':'↓ รายจ่าย'}</span></td><td><span class="inline-cell">${c}</span></td><td class="is-truncate"><span class="inline-cell">${desc}</span></td><td class="is-num num" style="font-weight:700;color:var(--color-${t==='income'?'success':'danger'})">${t==='income'?'+':'−'} ${a}</td><td class="is-center"><div class="cluster" style="gap:var(--space-1);justify-content:center;flex-wrap:nowrap"><button class="icon-btn">✏️</button><button class="icon-btn danger">🗑️</button></div></td></tr>`).join('')}

  settings: `

        <div class="quota-card">
          <div class="section-title-bar" style="margin-bottom:var(--space-3)">🤖 โควต้า AI สแกน / AI scan quota</div>
          <div class="quota-grid">
            <div class="quota-item"><span>รายวัน (Daily)</span><strong class="num">0 / 20</strong></div>
            <div class="quota-item"><span>รายเดือน (Monthly)</span><strong class="num">0 / 300</strong></div>
            <div class="quota-item"><span>คงเหลือ (Remaining)</span><strong class="num" style="color:var(--accent-primary)">300</strong></div>
          </div>
        </div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-header" style="margin-bottom:var(--space-4)"><span class="section-title-bar">รูปลักษณ์</span></div>
      <div class="stack-sm">
        <div class="setting-row"><div class="setting-row-copy"><strong>โหมดกลางคืน</strong><p>สลับเป็นธีมมืด</p></div><div class="setting-row-control"><span class="switch"><span class="switch-track"><span class="switch-knob"></span></span><span class="switch-label">OFF</span></span></div></div>
        <div class="setting-row"><div class="setting-row-copy"><strong>ภาษา</strong><p>ภาษาไทย</p></div><div class="setting-row-control"><select style="min-width:170px"><option>🇹🇭 ภาษาไทย</option></select></div></div>

    </section>
    <section class="panel">
      <div class="panel-header" style="margin-bottom:var(--space-4)"><span class="section-title-bar">ส่งออกและสำรองข้อมูล</span></div>
      <div class="stack-sm">
        <div class="setting-row"><div class="setting-row-copy"><strong>ส่งออกเป็น Excel</strong><p>บันทึกรายการทั้งหมดเป็นไฟล์ .xlsx</p></div><div class="setting-row-control"><button class="btn btn-ghost">ส่งออก</button></div></div>
        <div class="setting-row"><div class="setting-row-copy"><strong>สำรองข้อมูล</strong><p>สร้างไฟล์สำรองแบบ JSON</p></div><div class="setting-row-control"><button class="btn btn-ghost">สำรอง</button></div></div>
        <div class="setting-row"><div class="setting-row-copy"><strong>กู้คืนข้อมูล</strong><p>เขียนทับข้อมูลปัจจุบันด้วยไฟล์สำรอง</p></div><div class="setting-row-control"><button class="btn btn-danger">กู้คืน</button></div></div>
      </div>
    </section>
  </div>`,

  budget: `
  <div class="page">
    <header class="page-heading">
      <div><span class="eyebrow">ควบคุมงบประมาณ</span><h1>งบประมาณ</h1><p>ตั้งวงเงินรายหมวดหมู่พร้อมแจ้งเตือน</p></div>
      <div class="page-heading-actions"><div class="field"><label>เลือกเดือน</label><input type="month" value="2026-07"></div><button class="btn">+ ตั้งงบประมาณ</button></div>

      <div class="metric-tile expense"><span>ใช้ไปแล้ว</span><strong class="num">฿24,180</strong></div>
      <div class="metric-tile"><span>วงเงินรวม</span><strong class="num">฿32,000</strong></div>

const frame = document.getElementById('frame');
let dark = false;

function render(){
  const doc = frame.contentDocument;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="app.css"></head>
  <body style="margin:0"><div class="app ${dark?'dark-mode':''}" style="height:auto;min-height:100vh;overflow:visible">
    <div class="app-backdrop"></div>
    <nav class="sidebar">
      <div class="logo"><div class="logo-mark">M</div><div><h1>MoneyMa</h1><div class="logo-subtitle">Personal finance manager</div></div></div>
      <div class="sidebar-spotlight"><span class="sidebar-kicker">ภาพรวมเดือนนี้</span><strong>กรกฎาคม 2026</strong><p>ติดตามรายรับ รายจ่าย และสภาพคล่องในมุมมองเดียว</p></div>
      <ul class="nav-menu">
        ${[['◫','แดชบอร์ด','ภาพรวมการเงิน',1],['▤','ธุรกรรม','248 รายการ',0],['◭','สถิติ','กราฟและสถิติ',0],['▣','รายงาน','สรุปและส่งออก',0],['◎','งบประมาณ','ตั้งวงเงิน',0],['💎','Premium','ปลดล็อกฟีเจอร์',0],['◌','ตั้งค่า','ค่ากำหนด',0]]
        .map(([i,l,h,a])=>`<li><button class="${a?'active':''}"><span class="nav-icon">${i}</span><span class="nav-copy"><strong>${l}</strong><small>${h}</small></span></button></li>`).join('')}
      </ul>
      <div class="nav-footer"><div class="nav-footer-card"><div><div class="nav-footer-title">${dark?'โหมดกลางคืน':'โหมดสว่าง'}</div><div class="nav-footer-subtitle">สลับบรรยากาศของหน้าแอป</div></div><button class="theme-toggle"><span class="theme-toggle-knob ${dark?'active':''}"></span></button></div></div>
    </nav>
    <main class="main-content" style="overflow:visible">
      ${Object.values(PAGES).join('<div style="height:56px"></div>')}
    </main>
  </div></body></html>`);
  doc.close();
  setTimeout(()=>{ frame.style.height = Math.max(900, doc.body.scrollHeight + 40) + 'px'; }, 350);
}

document.getElementById('b-light').onclick = ()=>{dark=false;setPressed('theme');render();};
document.getElementById('b-dark').onclick = ()=>{dark=true;setPressed('theme');render();};
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{
  frame.style.width = b.dataset.w+'px';
  document.querySelectorAll('[data-w]').forEach(x=>x.setAttribute('aria-pressed', x===b));
});
function setPressed(){
  document.getElementById('b-light').setAttribute('aria-pressed', !dark);
  document.getElementById('b-dark').setAttribute('aria-pressed', dark);
}
render();
</script>
</body>
</html>
